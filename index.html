    <meta name="applebot-extended" content="noindex, nofollow" />
    <meta name="meta-externalagent" content="noindex, nofollow" />
    <meta name="bytespider" content="noindex, nofollow" />

    <!-- No caching: ensures the latest version is always loaded -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- Privacy: don't leak referrer when navigating away -->
    <meta name="referrer" content="no-referrer" />

    <!-- No description, no preview content for any embed/share -->
    <meta name="description" content="" />
    <meta property="og:title" content="" />
    <meta property="og:description" content="" />
    <meta name="twitter:card" content="" />

    <!-- Theme -->
    <meta name="theme-color" content="#06060b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
